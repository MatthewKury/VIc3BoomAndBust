 bb_market_momentum_bull_desc: "Bullish"

 # ── Market Health Modifiers ───────────────────────────────────────────────────
 bb_market_crashing: "Market Crash"
 bb_market_crashing_desc: "Financial markets have collapsed. Businesses cannot secure credit or capital, dragging all industrial output down severely."

 bb_market_contracting: "Contracting Markets"
 bb_market_contracting_desc: "Financial markets are shrinking. Reduced capital availability suppresses industrial output across the economy."

 bb_market_stable: "Sluggish Markets"
 bb_market_stable_desc: "Markets are technically stable but uninspiring. Cautious capital allocation produces a mild drag on industrial output."

 bb_market_booming: "Booming Markets"
 bb_market_booming_desc: "Financial markets are surging. Abundant credit and investor confidence provide a modest boost to industrial output."

 # ── Risk Stance Modifiers ─────────────────────────────────────────────────────
 bb_stance_pessimistic: "Investor Pessimism"
 bb_stance_pessimistic_desc: "Private investors have abandoned the market entirely. The state must drive economic growth, granting the government increased authority — but private investment has all but vanished and borrowing costs are punishing."

 bb_stance_cautious: "Investor Caution"
 bb_stance_cautious_desc: "Investors are pulling back sharply from private construction. The government steps in as the primary source of growth, gaining authority, while private capital formation and interest rate burdens remain elevated."

 bb_stance_tolerant: "Cautious Investment"
 bb_stance_tolerant_desc: "Investors are participating but reluctantly. Private investment is meaningfully below normal, and borrowing remains more expensive than the baseline."

 bb_stance_optimistic: "Cautious Optimism"
 bb_stance_optimistic_desc: "Investors are increasingly willing to deploy capital. Private investment is nearly back to normal levels."

 # ── Monopoly Power Modifiers ──────────────────────────────────────────────────
 bb_monopoly_present: "Emerging Monopolies"
 bb_monopoly_present_desc: "Large firms are beginning to dominate certain sectors. Consolidated production brings modest efficiency gains while industrialists and landowners grow more politically assertive."

 bb_monopoly_influential: "Influential Monopolies"
 bb_monopoly_influential_desc: "Monopolistic firms exert significant control over the economy. Market consolidation produces real output gains, but workers see their wages squeezed as competition diminishes and industrial and landed elites grow powerful."

 bb_monopoly_dominant: "Monopoly Dominance"
 bb_monopoly_dominant_desc: "A handful of firms control vast swaths of the economy. Output benefits from extreme consolidation, but industrialists and landowners wield outsized political power and workers' wages are heavily suppressed."

 # ── Monopoly Bar Monthly Progress Tooltips ───────────────────────────────────
 bb_monopoly_tick_laissez_faire: "Laissez-faire markets (unchecked)"
 bb_monopoly_tick_extraction: "Extraction economy"
 bb_monopoly_tick_traditionalism: "Traditionalist economy"
 bb_monopoly_tick_interventionism: "Interventionist regulation"
 bb_monopoly_tick_agrarianism: "Agrarian economy"
 bb_monopoly_tick_industry_banned: "Industry banned"
 bb_monopoly_tick_cooperative: "Cooperative ownership"
 bb_monopoly_tick_command: "Command economy (breaking up monopolies)"
 bb_monopoly_dissolution_active: "Monopoly dissolution case (active)"
 bb_monopoly_chartered: "Chartered companies hold legal monopolies"

 # ── Antitrust Law Group ───────────────────────────────────────────────────────
 lawgroup_bb_antitrust: "Antitrust Policy"
 lawgroup_bb_antitrust_desc: "How the government regulates the concentration of market power."

 law_bb_free_market: "Free Market"
 law_bb_free_market_desc: "The government does not interfere with market consolidation. Monopolies form and dissolve according to natural competitive pressures."

 law_bb_letters_of_patent: "Letters of Patent"
 law_bb_letters_of_patent_desc: "The government issues exclusive charters granting monopoly rights to favoured firms, administered by the #b Bureau of Market Relations#!. Each level of investment in the Bureau cheapens military goods (−5%) and construction inputs (−3%) supplied by the patent-holders, entrenches the political strength of capitalists and aristocrats (+3% each), and accelerates the growth of #b Monopoly Power#! (+30% per level). Incompatible with laissez-faire or collectivist economic systems."

 law_bb_oversight_committees: "Oversight Committees"
 law_bb_oversight_committees_desc: "The #b Bureau of Market Relations#! serves as a standing watchdog over market concentration. Each level of investment slows the growth of #b Monopoly Power#! (−35% at level 1, near-total suppression at full funding) and softens the blow of adverse market events (−10% to losses per level). The committees are funded through ordinary institutional upkeep."

 law_bb_anticompetitive_legislation: "Anticompetitive Legislation"
 law_bb_anticompetitive_legislation_desc: "Formal statutes prohibit collusion, predatory pricing, and other practices that entrench monopoly power, enforced by the #b Bureau of Market Relations#!. Each level of investment slows #b Monopoly Power#! growth (−15%), erodes the political strength of capitalists (−5%), strengthens dissolution cases (−0.25 monthly), and imposes compliance costs on industry (−1% throughput)."

 # ── Adjust Fiscal Temperature Button (on je_bb_financial) ────────────────────
 bb_fiscal_temperature_button: "Adjust Fiscal Temperature"
 bb_fiscal_temperature_button_desc: "Direct the treasury and central lenders to heat or cool the nation's investment climate. The chosen stance will steer investor risk appetite for the next five years and cannot be reversed until it has run its course."
 bb_fiscal_temp_active: "Fiscal temperature policy"

 # ── Risk Stance Character Influence Tooltips ─────────────────────────────────
 # NOTE: these are embedded in the PROGRESS_BAR_BREAKDOWN data function.
 # Apostrophes break its string parsing — do not use them here.
 bb_risk_ruler_heats: "Speculative temperament of the ruler"
 bb_risk_ruler_cools: "Prudent temperament of the ruler"
 bb_risk_gov_leaders: "Temperament of government leaders"
 bb_risk_public_figures: "Agitators and magnates swaying public sentiment"

 # ── bb.20: Fiscal Temperature Selection Event ────────────────────────────────
 bb.20.t: "Adjust the Fiscal Temperature"
 bb.20.desc: "The treasury awaits instruction. By loosening or tightening the flow of credit, the government can embolden investors to take greater risks — or restrain their exuberance before it curdles into folly. Whichever course is set will bind fiscal policy for the next five years."
 bb.20.a: "Flood the market with cheap credit."
 bb.20.a.tt: "Investor #b Risk Stance#! will rise #b rapidly#! for the next 5 years."
 bb.20.b: "Encourage lending on generous terms."
 bb.20.b.tt: "Investor #b Risk Stance#! will rise #b gradually#! for the next 5 years."
 bb.20.c: "Tighten lending standards."
 bb.20.c.tt: "Investor #b Risk Stance#! will fall #b gradually#! for the next 5 years."
 bb.20.d: "Impose strict credit discipline."
 bb.20.d.tt: "Investor #b Risk Stance#! will fall #b rapidly#! for the next 5 years."

 # ── bb.21: Fiscal Temperature Expiry Notification ────────────────────────────
 bb.21.t: "Fiscal Policy Runs Its Course"
 bb.21.desc: "Five years have passed since the government last set the fiscal temperature. The measures have expired, investor sentiment is once again drifting on its own currents, and the treasury stands ready to receive new instruction."
 bb.21.a: "Noted."

 # ── Dissolve Monopoly Button (on je_bb_financial) ─────────────────────────────
 bb_dissolve_monopoly_button: "Dissolve Monopoly"
 bb_dissolve_monopoly_button_desc: "Launch a formal government case against the nation's entrenched monopolies. The sitting Governor of the National Bank leads the inquiry — their interest group and character determine how it proceeds. Requires a seated Governor. The political cost is steep, and the industrialists and landed elite will not accept this quietly."

 # ── Antitrust Case Cost Modifier ─────────────────────────────────────────────
 bb_antitrust_case_cost: "Antitrust Proceedings"
 bb_antitrust_case_cost_desc: "The government is pressing an active case against monopolistic firms. Sustaining political pressure on powerful interests drains authority."

 # ── Dissolution Marker & Champion Modifiers ──────────────────────────────────
 bb_monopoly_dissolution: "Monopoly Dissolution (Active)"
 bb_monopoly_dissolution_desc: "A formal case is dismantling entrenched monopolies. Its monthly effect on market concentration depends on who leads the inquiry — their interest group, character, and ideology — and on the strength of the nation's antitrust statutes."

 bb_case_conflicted_champion: "Steering the Inquiry"
 bb_case_conflicted_champion_desc: "This interest group's own member heads the antitrust inquiry as Governor of the National Bank — and is quietly steering it to entrench their own group's political position while sparing favoured firms."

 # ── bb.10: Governor Confirmation Event ────────────────────────────────────────
 bb.10.t: "Launch an Antitrust Case"
 bb.10.desc.industrialists: "The monopolies have grown powerful enough to warrant a formal government response, and the task falls to Governor [SCOPE.sCharacter('bb_case_leader').GetFullName]. But the Governor's own circle sits among the Industrialists — the very men whose combines stand accused. Favoured houses may find the scrutiny strangely gentle, even as the Governor's faction quietly gains from steering the case."
 bb.10.desc.landowners: "The monopolies have grown powerful enough to warrant a formal government response, and the task falls to Governor [SCOPE.sCharacter('bb_case_leader').GetFullName]. But the Governor's own circle sits among the Landowners — old money with every reason to see the case handled gently. Favoured houses may find the scrutiny strangely light, even as the Governor's faction quietly gains from steering the case."
 bb.10.desc.unions: "The monopolies have grown powerful enough to warrant a formal government response, and the task falls to Governor [SCOPE.sCharacter('bb_case_leader').GetFullName]. The Governor's own circle among the Trade Unions has waited a long time for this day, and will press the case hard — the monopolists should expect no quarter, and no shortage of enemies made along the way."
 bb.10.desc.default: "The monopolies have grown powerful enough to warrant a formal government response, and the task falls to Governor [SCOPE.sCharacter('bb_case_leader').GetFullName]. The Governor answers to no faction with an obvious stake in the outcome, and will pursue the case on its merits — how effectively depends entirely on the Governor's own competence and convictions."
 bb.10.a: "We proceed."

