 # ── Journal Entry ─────────────────────────────────────────────────────────────
 je_bb_financial: "Boom & Bust: Financial Monitor"
 je_bb_financial_reason: "The nation's financial system requires attention."
 je_bb_financial_desc: "Three forces shape the financial landscape of your nation. The health of the market determines industrial output. The risk appetite of investors governs private capital formation. The concentration of monopoly power shifts wealth and political influence toward the elite.\n\n#Y How the Market Moves#!\nEach month the exchanges produce a piece of market news that jolts #b Market Health#!, and some of it also plants an #b underlying trend#! that drifts the market for months afterwards — sometimes in the #b opposite direction#! of the headline. Easy credit rises now and falls later; a painful credit squeeze clears the ground for recovery. Roughly #b every other year#! a major crisis or opportunity strikes, and which one depends on where Market Health stands when it hits: a #b mania#! above 65, a #b panic#! below 40, #b foreign capital#! in between.\n\n#Y Reading the Market#!\nThat underlying trend is no longer hidden. The #b Market Momentum#! needle exposes it directly — leaning #g bull#! (right) while the market trends upward and #r bear#! (left) while it trends down, easing back to centre once the trend fades. For more than a glance, #b Commission a Market Survey#! and pay for a plain-language reading of where prices are truly headed. And to act rather than watch, #b Open-Market Operations#! sends the National Bank into the market to lean the trend for or against you — a hand on the tiller of a market that otherwise moves on its own.\n\n#Y Risk Cuts Both Ways#!\nYour #b Risk Stance#! multiplies every market swing — and not evenly. #b Audacious#! investors magnify gains ×1.8 but losses #b ×2.5#!; #b Optimistic#!, ×1.4 and ×1.7. Timid stances mute both and quietly place a #b floor#! under the market: while investors are #b Pessimistic#!, Market Health will not be knocked below ~35, and while merely #b Cautious#!, not below ~20. Timid capital cannot crash — but it cannot boom, and it starves private construction.\n\n#Y The Boom-Bust Cycle#!\nProsperity breeds its own undoing. While Market Health stays above 60, investor confidence swells and Risk Stance creeps upward on its own — arming the very multiplier that will deepen the next fall. Long booms end in hard crashes unless something cools the temperature: strict fiscal policy, a prudent Bank Governor, or deliberately deflating a mania before it bursts. Every National Bank rescue also teaches investors their losses will be covered — #b moral hazard#! heats Risk Stance for years and #b stacks#! with each bailout.\n\n#Y The Bank Governor#!\nHow the seat is filled depends on the nation's #b Bureaucracy law#!: under Hereditary Bureaucrats it passes to the Landowners' own leader by birthright, under Elected Bureaucrats a career civil servant is drawn on merit alone with no faction gaining influence from the post, and under Appointed Bureaucrats — the common case — the seat is political patronage, drawn from a coalition of financier, statesman, and scholar candidates. Dismissing a sitting governor costs authority for longer under a hereditary or civil-service seat than under an ordinary appointment. The governor is more than their monthly bar contribution. Their temperament silently #b scales the size of market shocks#!: a hot-headed governor amplifies everything ×1.3, a prudent one softens losses ×0.7, and a born entrepreneur stretches gains ×1.2. A governor with vices courts #b scandal#! every month they hold office — and looking the other way once makes scandals permanently twice as likely. Two unbroken years of #b Booming#! markets earn them the Lion of the Bourse, an upward drift on reputation alone.\n\n#Y Monopoly Power#!\nConcentration drifts with your economic laws, and the #b Bureau of Market Relations#! multiplies that drift according to your Antitrust Policy — patents accelerate it, oversight and legislation restrain it, scaling with every level of Bureau investment. Companies holding #b royal monopoly charters#! add concentration the Bureau cannot restrain. A #b dissolution case#! is always led by the sitting #b Bank Governor#!, and its monthly bite depends entirely on them: their interest group, traits, and ideology. A Trade Union governor cuts deep; an Industrialist or Landowner governor quietly spares favoured firms and strengthens their own faction instead.\n\n#Y Financial Market Health#!\n  #R Crashing#! (0–19)  •  #r Contracting#! (20–39)  •  Stable (40–59)  •  #g Growing#! (60–79)  •  #G Booming#! (80–100)\n\n#Y Financial Risk Stance#!\n  #R Pessimistic#! (0–19)  •  #r Cautious#! (20–39)  •  Tolerant (40–59)  •  #g Optimistic#! (60–79)  •  #G Audacious#! (80–100)\n\n#Y Monopoly Power#!\n  Non-existent (0–19)  •  Trivial (20–39)  •  #y Present#! (40–59)  •  #r Influential#! (60–79)  •  #R Dominant#! (80–100)"

 # ── Progress Bar Labels ───────────────────────────────────────────────────────
