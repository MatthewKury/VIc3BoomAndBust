 # ── Newsfeed: Minor Market Events ─────────────────────────────────────────────
 # Each desc ends with a one-line summary of what the event means for
 # Financial Market Health, shown directly in the feed item.

 notification_bb_news_earnings_name: "Strong Earnings Season"
 notification_bb_news_earnings_desc: "The great firms report handsome profits, and the exchanges respond warmly.\n\n#b Market Health:#! #G a solid rise#! this month."
 notification_bb_news_earnings_tooltip: "#header $notification_bb_news_earnings_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_earnings_desc$\n\nThe magnitude of market gains and losses scales with the nation's #b Risk Stance#! — bold stances amplify losses more than gains."

 notification_bb_news_flotation_name: "Triumphant Share Flotation"
 notification_bb_news_flotation_desc: "A new joint-stock venture is oversubscribed within hours of opening its books.\n\n#b Market Health:#! #G a sharp rise#! this month."
 notification_bb_news_flotation_tooltip: "#header $notification_bb_news_flotation_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_flotation_desc$\n\nThe magnitude of market gains and losses scales with the nation's #b Risk Stance#! — bold stances amplify losses more than gains."

 notification_bb_news_foreign_capital_name: "Foreign Capital Trickles In"
 notification_bb_news_foreign_capital_desc: "Overseas financiers are quietly taking positions in our markets, and the inflow is expected to continue.\n\n#b Market Health:#! #G a small rise#! now, and #g a rising trend#! for the months ahead."
 notification_bb_news_foreign_capital_tooltip: "#header $notification_bb_news_foreign_capital_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_foreign_capital_desc$\n\nThe magnitude of market gains and losses scales with the nation's #b Risk Stance#! — bold stances amplify losses more than gains."

 notification_bb_news_credit_expansion_name: "Credit Flows Freely"
 notification_bb_news_credit_expansion_desc: "Lenders are extending credit on remarkably generous terms. The exchanges cheer — though sober voices warn that today's easy money will be tomorrow's reckoning.\n\n#b Market Health:#! #G a sharp rise#! now, but #R a falling trend#! for the months ahead."
 notification_bb_news_credit_expansion_tooltip: "#header $notification_bb_news_credit_expansion_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_credit_expansion_desc$\n\nThe magnitude of market gains and losses scales with the nation's #b Risk Stance#! — bold stances amplify losses more than gains."

 notification_bb_news_confidence_name: "Confidence Builds"
 notification_bb_news_confidence_desc: "Little has changed on the exchanges themselves, but merchants and financiers alike speak of brighter months ahead.\n\n#b Market Health:#! #G a slight rise#! now, and #g a strong rising trend#! for the months ahead."
 notification_bb_news_confidence_tooltip: "#header $notification_bb_news_confidence_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_confidence_desc$\n\nThe magnitude of market gains and losses scales with the nation's #b Risk Stance#! — bold stances amplify losses more than gains."

 notification_bb_news_bureau_charter_name: "Bureau Charter Expanded"
 notification_bb_news_bureau_charter_desc: "New learning has widened the mandate of the #b Bureau of Market Relations#!. Its maximum investment level has increased — check the institution panel to fund it deeper."
 notification_bb_news_bureau_charter_tooltip: "#header $notification_bb_news_bureau_charter_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_bureau_charter_desc$"

 notification_bb_news_bank_failure_name: "Provincial Bank Fails"
 notification_bb_news_bank_failure_desc: "A regional lender has shuttered its doors, and depositors crowd the street outside demanding their savings.\n\n#b Market Health:#! #R a sharp fall#! this month."
 notification_bb_news_bank_failure_tooltip: "#header $notification_bb_news_bank_failure_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_bank_failure_desc$\n\nThe magnitude of market gains and losses scales with the nation's #b Risk Stance#! — bold stances amplify losses more than gains."

 notification_bb_news_commodity_glut_name: "Commodity Glut"
 notification_bb_news_commodity_glut_desc: "Warehouses overflow and prices sag as key goods find no buyers.\n\n#b Market Health:#! #R a moderate fall#! this month."
 notification_bb_news_commodity_glut_tooltip: "#header $notification_bb_news_commodity_glut_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_commodity_glut_desc$\n\nThe magnitude of market gains and losses scales with the nation's #b Risk Stance#! — bold stances amplify losses more than gains."

 notification_bb_news_fraud_scandal_name: "Fraud at a Great House"
 notification_bb_news_fraud_scandal_desc: "A celebrated financier stands exposed as a swindler. Confidence in the exchanges is shaken, and the whispers will not soon die down.\n\n#b Market Health:#! #R a heavy fall#! now, and #R a falling trend#! for the months ahead."
 notification_bb_news_fraud_scandal_tooltip: "#header $notification_bb_news_fraud_scandal_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_fraud_scandal_desc$\n\nThe magnitude of market gains and losses scales with the nation's #b Risk Stance#! — bold stances amplify losses more than gains."

 notification_bb_news_foreign_wobble_name: "Tremors in Foreign Markets"
 notification_bb_news_foreign_wobble_desc: "Unsettling news from exchanges abroad has made our own investors briefly hesitant.\n\n#b Market Health:#! #R a small dip#! this month."
 notification_bb_news_foreign_wobble_tooltip: "#header $notification_bb_news_foreign_wobble_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_foreign_wobble_desc$\n\nThe magnitude of market gains and losses scales with the nation's #b Risk Stance#! — bold stances amplify losses more than gains."

 notification_bb_news_credit_tightening_name: "Lenders Tighten Their Books"
 notification_bb_news_credit_tightening_desc: "Credit has grown dear and speculative ventures are being called in. Painful — but the survivors will stand on firmer ground.\n\n#b Market Health:#! #R a moderate fall#! now, but #g a rising trend#! for the months ahead."
 notification_bb_news_credit_tightening_tooltip: "#header $notification_bb_news_credit_tightening_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_credit_tightening_desc$\n\nThe magnitude of market gains and losses scales with the nation's #b Risk Stance#! — bold stances amplify losses more than gains."

 # ── Bureau of Market Relations Institution ────────────────────────────────────
 institution_bb_market_relations: "Bureau of Market Relations"
 institution_bb_market_relations_desc: "The government office charged with managing the state's relationship to the nation's markets. Its character depends entirely on the governing Antitrust Policy: a patent office under Letters of Patent, a watchdog under Oversight Committees, an enforcement agency under Anticompetitive Legislation. Its maximum investment level grows with society technologies: Stock Exchange (1), Corporate Charters (2), Philosophical Pragmatism (3), and Macroeconomics (5)."

 # ── Bureau Max Investment Modifier Type ───────────────────────────────────────
 country_institution_bb_market_relations_max_investment_add: "Max $institution_bb_market_relations$ [concept_institution] Investment"
 country_institution_bb_market_relations_max_investment_add_desc: "A bonus or penalty to the maximum investment level of the $institution_bb_market_relations$ [concept_institution]"

 # ── Bureau Investment Cap Charters (from society techs) ──────────────────────
 bb_market_relations_charter_1: "Bureau Charter: Corporate Charters"
 bb_market_relations_charter_1_desc: "Standardised incorporation gives the Bureau of Market Relations legal handles on the firms it oversees, permitting deeper investment."
 bb_market_relations_charter_2: "Bureau Charter: Philosophical Pragmatism"
 bb_market_relations_charter_2_desc: "A philosophy of practical consequences teaches the Bureau of Market Relations to judge markets by results rather than doctrine, permitting deeper investment."
 bb_market_relations_charter_3: "Bureau Charter: Macroeconomics"
 bb_market_relations_charter_3_desc: "Economic theory at last describes the whole. The Bureau of Market Relations may be invested to its fullest extent."

 # ── Bailout Burden Modifier ───────────────────────────────────────────────────
 bb_bailout_burden: "Bailout Burden"
 bb_bailout_burden_desc: "The treasury borrowed heavily to guarantee bank deposits during the panic. Servicing that debt keeps the state's borrowing costs elevated."

 # ── bb.1: The Age of Capital (JE launch + inaugural governor selection) ───────
 bb.1.t: "The Age of Capital"
 bb.1.desc.appointed: "A new force has taken its seat alongside crown, church, and army: the market. In the coffee houses and counting rooms of the capital, fortunes are conjured from paper and confidence — and can vanish by the same magic. From this day forward the government will keep a standing watch on three currents that will shape the nation's fate: the #b health of the financial markets#!, the #b risk appetite of investors#!, and the slow gathering of #b monopoly power#!.\n\nThe first duty of this new age is to name a #b Governor of the National Bank#!. The governor's skill will steer the markets month after month, their temperament will set the mood of investors, and their vices will be the government's problem. Only figures aligned with the governing coalition are under consideration — inspect each candidate before deciding."
 bb.1.desc.hereditary: "A new force has taken its seat alongside crown, church, and army: the market. In the coffee houses and counting rooms of the capital, fortunes are conjured from paper and confidence — and can vanish by the same magic. From this day forward the government will keep a standing watch on three currents that will shape the nation's fate: the #b health of the financial markets#!, the #b risk appetite of investors#!, and the slow gathering of #b monopoly power#!.\n\nThe first duty of this new age is to name a #b Governor of the National Bank#!. Under the settled custom of hereditary office, the seat is the Landowners' birthright — the governor's skill will steer the markets month after month, their temperament will set the mood of investors, and their vices will be the government's problem. Inspect the candidate before confirming them."
 bb.1.desc.elected: "A new force has taken its seat alongside crown, church, and army: the market. In the coffee houses and counting rooms of the capital, fortunes are conjured from paper and confidence — and can vanish by the same magic. From this day forward the government will keep a standing watch on three currents that will shape the nation's fate: the #b health of the financial markets#!, the #b risk appetite of investors#!, and the slow gathering of #b monopoly power#!.\n\nThe first duty of this new age is to name a #b Governor of the National Bank#!. Under a career civil service, the post goes to merit alone — no faction's patronage, no coalition arithmetic. The governor's skill will steer the markets month after month, their temperament will set the mood of investors, and their vices will be the government's problem. Inspect the candidate before confirming them."
 bb.1.a: "Appoint the financier, [SCOPE.sCharacter('bb_gov_cand_fin').GetFullName]."
 bb.1.a.tt: "A magnate takes the chair. Their business acumen — and their appetites — now steer the #b Financial Market Health#! and #b Risk Stance#! bars each month, and their interest group gains political strength while they serve. Hover their name to inspect their traits."
 bb.1.b: "Appoint the statesman, [SCOPE.sCharacter('bb_gov_cand_gov').GetFullName]."
 bb.1.b.tt: "A leader from the governing coalition takes the chair. Their character now steers the #b Financial Market Health#! and #b Risk Stance#! bars each month, and their interest group gains political strength while they serve. Hover their name to inspect their traits."
 bb.1.c: "Appoint the scholar, [SCOPE.sCharacter('bb_gov_cand_sch').GetFullName]."
 bb.1.c.tt: "A studious mind takes the chair. Their learning now steers the #b Financial Market Health#! and #b Risk Stance#! bars each month, and their interest group gains political strength while they serve. Hover their name to inspect their traits."
 bb.1.d: "Appoint the patrician, [SCOPE.sCharacter('bb_gov_cand_heir').GetFullName]."
 bb.1.d.tt: "The Landowners' own leader takes the chair, by birthright as much as by choice. Their character now steers the #b Financial Market Health#! and #b Risk Stance#! bars each month, and their interest group gains political strength while they serve. Hover their name to inspect their traits."
 bb.1.e: "Appoint the administrator, [SCOPE.sCharacter('bb_gov_cand_civil').GetFullName]."
 bb.1.e.tt: "A career civil servant takes the chair on merit alone, answering to no faction. Their competence now steers the #b Financial Market Health#! and #b Risk Stance#! bars each month — but no interest group gains political strength from their tenure. Hover their name to inspect their traits."
 bb.1.z: "The Bank can open without a governor for now."

 # ── bb.30: Mania on the Exchange ──────────────────────────────────────────────
 bb.30.t: "Mania on the Exchange"
 bb.30.desc: "A speculative fever has gripped the exchanges. Clerks mortgage their salaries to buy shares, respectable matrons trade tips at the opera, and every week a new venture is floated to feverish applause. The nation's financiers insist this time is different. The government must decide whether to let the mania run its course — or take away the punch bowl."
 bb.30.a: "Let the good times roll."
 bb.30.a.tt: "Financial #b Market Health#! surges #b now#!, but a #b strong downward trend#! will drag the market for the next #b 12 months#! as the mania unwinds."
 bb.30.b: "Deflate the bubble before it bursts on its own."
 bb.30.b.tt: "Financial #b Market Health#! drops #b now#!, but a #b steady upward trend#! will support the market for #b 12 months#!. Capitalists are furious at the lost paper fortunes."
 bb.30.c: "Channel the fever into productive industry."
 bb.30.c.tt: "The Industrialists steer speculation toward real factories. #b Market Health#! rises now with only a #b mild downward trend#! to follow, and capitalists are pleased."
 bb.30.d: "Rein in these speculating parvenus."
 bb.30.d.tt: "The Landowners impose old-fashioned restraint. #b Market Health#! dips now but gains a #b mild upward trend#!. The aristocracy approves; the capitalists do not."

 # ── bb.31: Panic! ─────────────────────────────────────────────────────────────
 bb.31.t: "Panic!"
 bb.31.desc: "It began with a rumour, as it always does. By noon the street outside the banks was impassable, and by nightfall respectable institutions were paying out savings in worthless scrip. The panic now feeds upon itself. The government must choose who is to be saved — and who is to be sacrificed."
 bb.31.a: "The treasury will guarantee every deposit."
 bb.31.a.tt: "Financial #b Market Health#! steadies #b now#! and gains a #b strong upward trend#! for #b 12 months#! — but the treasury must borrow heavily, raising the nation's #b loan interest#! for #b 24 months#!."
 bb.31.b: "Let the weak banks fail."
 bb.31.b.tt: "Financial #b Market Health#! plunges #b now#!, but the purge clears the rot: a #b very strong upward trend#! follows for #b 12 months#!. The ruined middle classes will not forgive quickly."
 bb.31.c: "Shield the small depositor. Punish the financier."
 bb.31.c.tt: "The Trade Unions demand justice. #b Market Health#! slips a little now but gains a #b solid upward trend#!. Workers are grateful; capitalists seethe."
 bb.31.d: "Return to hard money and sound banking."
 bb.31.d.tt: "The Landowners restore gold-backed discipline. #b Market Health#! dips now, but a #b long, steady upward trend#! follows for #b 18 months#!. The aristocracy approves."
 bb.31.e: "Let the Bureau coordinate an orderly resolution."
 bb.31.e.tt: "The #b Bureau of Market Relations#! arranges mergers, receiverships, and quiet guarantees among the banks themselves. #b Market Health#! steadies #b now#! and gains a #b strong upward trend#! for #b 12 months#! — with no burden on the treasury. The middle classes are reassured.\n\nAvailable because the Bureau is invested at #b level 2#! or higher."

 # ── bb.32: Foreign Capital Comes Calling ──────────────────────────────────────
 bb.32.t: "Foreign Capital Comes Calling"
 bb.32.desc: "A consortium of foreign financiers has arrived in the capital with letters of introduction and very deep pockets. They propose to underwrite our markets on a grand scale. Their money is real enough — but money from abroad always arrives with strings attached, and the shopkeepers already mutter about foreign masters."
 bb.32.a: "Welcome them with open arms."
 bb.32.a.tt: "Financial #b Market Health#! rises #b now#! and gains an #b upward trend#! for #b 10 months#!. The middle classes resent the foreign presence."
 bb.32.b: "Politely decline."
 bb.32.b.tt: "No change to the markets. The middle classes appreciate the government standing up for domestic interests."
 bb.32.c: "Accept — under strict domestic-ownership requirements."
 bb.32.c.tt: "The Petty Bourgeoisie writes the terms. #b Market Health#! dips slightly now but gains a #b modest upward trend#! for #b 12 months#!, and the shopkeepers are pleased."
 bb.32.d: "Demand their expertise alongside their capital."
 bb.32.d.tt: "The Intelligentsia negotiates for knowledge as well as money. #b Market Health#! rises now and gains a #b strong upward trend#! for #b 10 months#!."

 # ── Bank Governor Traits ──────────────────────────────────────────────────────
 bb_bank_governor: "Governor of the National Bank"
 bb_bank_governor_desc: "This character directs the nation's central lending institution. Their acumen steers the #b health of the financial markets#!, their temperament sets the mood of investors, and their vices — if they have any — are a scandal waiting to surface."
 bb_lion_of_the_bourse: "Lion of the Bourse"
 bb_lion_of_the_bourse_desc: "This character presided over two unbroken years of booming markets as Governor of the National Bank. Their name alone steadies the exchanges: while they hold the governorship, markets drift upward on reputation."

 # ── Governor & Intervention Modifiers ─────────────────────────────────────────
 bb_governor_patron: "Controls the National Bank"
 bb_governor_patron_desc: "This interest group's member holds the Governorship of the National Bank, and the nation's money answers to their circle."

 bb_governor_dismissal_backlash: "Governor Sacked"
 bb_governor_dismissal_backlash_desc: "The government dismissed the Governor of the National Bank without ceremony. Questions are asked in every salon, and spending political capital to answer them drains authority."

 bb_exchange_closed: "Exchange Suspended"
 bb_exchange_closed_desc: "The government has declared a market holiday. No shares change hands, no panics spread — and no capital moves. Commerce chokes while the doors stay shut, and the moneyed classes sit on their funds."

 bb_coverup_strain: "Buried Scandal"
 bb_coverup_strain_desc: "The government hushed up a scandal at the National Bank. The men who kept the secret expect to be paid in favours, and favours cost authority."

 bb_market_support_ops: "Open-Market Operations: Supporting"
 bb_market_support_ops_desc: "The National Bank is buying into the market to hold prices up. For nine months it draws a monthly cost from the treasury — scaled to the size of the economy — together with a steady toll on authority, rather than a single payment."
 bb_market_cooling_ops: "Open-Market Operations: Cooling"
 bb_market_cooling_ops_desc: "The National Bank is selling into the market and holding rates high to let the air out of a boom. A lighter monthly treasury cost over nine months (also scaled to the economy), with the same steady draw on authority — tight money wins few friends."

 # ── Governor & Intervention Buttons (on je_bb_financial) ──────────────────────
 bb_appoint_governor_button: "Appoint a Bank Governor"
 bb_appoint_governor_button_desc: "Seat a governor at the National Bank. Their acumen will steer the health of the markets, their temperament will set the mood of investors, and their appetites — if they have any — will be your problem. The appointee carries the office visibly as a character trait. How the candidate pool is drawn — political patronage, hereditary right, or civil-service merit — depends on the nation's Bureaucracy law."
 bb_dismiss_governor_button: "Dismiss the Governor"
 bb_dismiss_governor_button_desc: "Remove the sitting Governor of the National Bank from office. Their interest group will take the insult personally, and the abrupt dismissal will cost the government authority for a year — longer still if the office is a hereditary right or a protected civil-service post — unless the government has been reformed or re-elected within the past 12 months, in which case a new administration naming its own banker is ordinary housekeeping: no public anger, only a brief administrative backlash."
 bb_intervene_button: "National Bank Intervention"
 bb_intervene_button_desc: "Direct the National Bank to act as lender of last resort while the markets falter. Treasury money can steady the exchanges — but every rescue teaches investors that their losses will be underwritten, heating the nation's #b Risk Stance#! for years. Available once every 24 months, and only while #b Market Health#! is below 40."
 bb_market_holiday_button: "Suspend the Exchange"
 bb_market_holiday_button_desc: "Declare a market holiday and bar the exchange doors for four months. No shocks can strike a market that is not trading — but the underlying trend keeps running, commerce suffers while the doors are shut, and the capitalists will be furious. Available once every 36 months, and only while #b Market Health#! is below 20 (Crashing)."

 # ── Market Operations & Survey Buttons (on je_bb_financial) ───────────────────
 bb_open_market_operations_button: "Open-Market Operations"
 bb_open_market_operations_button_desc: "Direct the National Bank to lean on the market. Buying props up a faltering market and plants an #G upward trend#!; selling cools an overheating one and plants a #R downward trend#! — the counter to a runaway boom before an audacious #b Risk Stance#! turns the next fall into a crash. Either way the #b Market Momentum#! needle swings in response. Each operation carries a #R monthly cost to your budget — scaled to the size of your economy — and a steady drain on authority#! for nine months, rather than a single payment; supporting the market also breeds a little #b moral hazard#!. Available once every 18 months."
 bb_market_survey_button: "Commission a Market Survey"
 bb_market_survey_button_desc: "Pay the exchanges' analysts for a candid reading of where the market is truly headed — the plain-language outlook behind the #b Market Momentum#! needle, together with what the current market band means for you. Costs a modest fee, scaled to the size of your economy. Available once every 12 months."

 # ── Governor Bar Row Tooltips ────────────────────────────────────────────────
 # NOTE: embedded in PROGRESS_BAR_BREAKDOWN — no apostrophes allowed here.
 bb_health_governor_acumen: "Stewardship of the Bank Governor"
 bb_risk_governor_heats: "Speculative temperament of the Bank Governor"
 bb_risk_governor_cools: "Prudent temperament of the Bank Governor"
 bb_risk_moral_hazard: "Moral hazard from National Bank rescues"
 bb_risk_exuberance_growing: "Confidence grows with the healthy market"
 bb_risk_exuberance_booming: "Booming markets breed overconfidence"
 bb_monopoly_backroom: "Backroom favours from a buried scandal"

 # ── bb.40: Appoint a Bank Governor ────────────────────────────────────────────
 bb.40.t: "The Governorship of the National Bank"
 bb.40.desc.appointed: "The National Bank requires a hand on the tiller, and the capital is thick with candidates — though only figures aligned with the governing coalition are under consideration. Choose carefully: the governor's #b skill#! will quietly steer the health of the markets month after month, their #b temperament#! will heat or cool the appetite of investors, and any #b vices#! they bring to the office have a way of surfacing at the worst possible moment. Inspect each candidate before deciding — their traits are their record."
 bb.40.desc.hereditary: "The National Bank requires a hand on the tiller, and custom dictates it fall once more to the Landowners' own leader — the office is a birthright as much as a burden. Choose carefully all the same: the governor's #b skill#! will quietly steer the health of the markets month after month, their #b temperament#! will heat or cool the appetite of investors, and any #b vices#! they bring to the office have a way of surfacing at the worst possible moment. Inspect the candidate before deciding — their traits are their record."
 bb.40.desc.elected: "The National Bank requires a hand on the tiller, and the civil service has put forward its most capable officer — chosen on merit, beholden to no faction. The governor's #b skill#! will quietly steer the health of the markets month after month, their #b temperament#! will heat or cool the appetite of investors, and any #b vices#! they bring to the office have a way of surfacing at the worst possible moment. Inspect the candidate before deciding — their traits are their record."
 bb.40.a: "Appoint the financier, [SCOPE.sCharacter('bb_gov_cand_fin').GetFullName]."
 bb.40.a.tt: "A magnate takes the chair. Their business acumen — and their appetites — now steer the #b Financial Market Health#! and #b Risk Stance#! bars each month, and their interest group gains political strength while they serve. Hover their name to inspect their traits."
 bb.40.b: "Appoint the statesman, [SCOPE.sCharacter('bb_gov_cand_gov').GetFullName]."
 bb.40.b.tt: "A leader from the governing coalition takes the chair. Their character now steers the #b Financial Market Health#! and #b Risk Stance#! bars each month, and their interest group gains political strength while they serve. Hover their name to inspect their traits."
 bb.40.c: "Appoint the scholar, [SCOPE.sCharacter('bb_gov_cand_sch').GetFullName]."
 bb.40.c.tt: "A studious mind takes the chair. Their learning now steers the #b Financial Market Health#! and #b Risk Stance#! bars each month, and their interest group gains political strength while they serve. Hover their name to inspect their traits."
 bb.40.d: "Appoint the patrician, [SCOPE.sCharacter('bb_gov_cand_heir').GetFullName]."
 bb.40.d.tt: "The Landowners' own leader takes the chair, by birthright as much as by choice. Their character now steers the #b Financial Market Health#! and #b Risk Stance#! bars each month, and their interest group gains political strength while they serve. Hover their name to inspect their traits."
 bb.40.e: "Appoint the administrator, [SCOPE.sCharacter('bb_gov_cand_civil').GetFullName]."
 bb.40.e.tt: "A career civil servant takes the chair on merit alone, answering to no faction. Their competence now steers the #b Financial Market Health#! and #b Risk Stance#! bars each month — but no interest group gains political strength from their tenure. Hover their name to inspect their traits."
 bb.40.z: "The seat can stay empty a while longer."

 # ── bb.42: The Governorship Falls Vacant ──────────────────────────────────────
 bb.42.t: "The Governorship Falls Vacant"
 bb.42.desc: "The Governor of the National Bank is gone — the chair stands empty, the ledgers unsigned. Markets loathe nothing so much as uncertainty at the top: the exchanges have already wobbled on the news. A successor can be found at once, or the seat can stand vacant while the government attends to other things."
 bb.42.a: "Convene the search for a successor at once."
 bb.42.b: "The seat can stand vacant for now."

 # ── bb.43: Scandal at the National Bank ───────────────────────────────────────
 bb.43.t: "Scandal at the National Bank"
 bb.43.desc: "It is in the morning papers, and by now it is in the evening ones too: Governor [SCOPE.sCharacter('bb_gov').GetFullName] has been living considerably beyond the dignity of the office, and the money trail runs straight through the National Bank's books. The treasury has quietly absorbed the immediate losses and the exchanges have taken fright. What remains is the question of what the government intends to do about its governor."
 bb.43.a: "Bury it. The Bank must appear unimpeachable."
 bb.43.a.tt: "The scandal disappears — for a price. The men who kept the secret expect favours: #R authority is drained for 24 months#! and #b Monopoly Power#! creeps upward for a year as they trade on what they know. The governor remains in office, vices intact."
 bb.43.b: "Prosecute. No one is above the law."
 bb.43.b.tt: "The governor is removed and tried. Their interest group is furious, but the public is reassured that the law reaches even the Bank — the middle classes gain loyalists. The governorship falls vacant."
 bb.43.c: "A private reprimand will suffice."
 bb.43.c.tt: "Nothing is paid today — but the Bank learns that nothing will ever be paid. Scandals become #R permanently twice as likely#! under governors with vices."

 # ── bb.50: National Bank Intervention ─────────────────────────────────────────
 bb.50.t: "Lender of Last Resort"
 bb.50.desc: "The markets are faltering and the discount window is crowded with men holding paper no one else will touch. The National Bank can act — with the treasury standing behind it — but every banker in the capital is watching to see whether losses, once made, are ever truly borne by those who made them."
 bb.50.a: "Flood the discount window. Save them all."
 bb.50.a.tt: "A massive treasury outlay (scaled to GDP). #b Market Health#! surges now and gains a #G strong upward trend#! for 12 months — but investors learn the lesson well: #b Risk Stance#! is pulled #R strongly upward for 30 months#! (moral hazard)."
 bb.50.b: "Guarantee only the sound institutions."
 bb.50.b.tt: "A moderate treasury outlay (scaled to GDP). #b Market Health#! steadies now and gains an #G upward trend#! for 12 months, with a #R milder moral hazard#! pull on #b Risk Stance#! for 24 months."
 bb.50.c: "Say a few well-chosen words. Spend nothing."
 bb.50.c.tt: "Confidence is a currency too. #b Market Health#! firms slightly with a #g brief upward trend#! — no treasury cost, no moral hazard.\n\nAvailable because a voice the markets heed — a #b charismatic ruler#! or a #b communicator governor#! — speaks for the Bank."
 bb.50.d: "The Bank stands aside."
 bb.50.d.tt: "No rescue, no cost, no lesson taught. The emergency session still counts against the 24-month cooldown."

 # ── bb.60: Open-Market Operations ─────────────────────────────────────────────
 bb.60.t: "Open-Market Operations"
 bb.60.desc: "The National Bank sits ready to enter the market on the government's account. It can put the treasury to work buying up paper and steadying prices, or it can sell into the market and tighten the discount rate to let the air out of an overheated boom. Neither is free, and neither is subtle — every trader in the capital will read the Bank's hand and position accordingly."
 bb.60.a: "Support the market. Buy, and steady prices."
 bb.60.a.tt: "The Bank buys into the market for #R nine months#! — a #R monthly cost to your budget, scaled to the size of your economy, and a steady drain on authority#!, not a lump sum. #b Market Health#! ticks up now and gains an #G upward trend#! for 9 months, and the #b Market Momentum#! needle swings bull. Propping up prices with public money also teaches a #R mild moral hazard#! lesson: #b Risk Stance#! is pulled upward for 18 months."
 bb.60.b: "Cool the market. Sell, and tighten rates."
 bb.60.b.tt: "Tighter money for #R nine months#! — a #R lighter monthly budget cost (also scaled to your economy), and the same steady drain on authority#!. #b Market Health#! eases now and gains a #R downward trend#! for 9 months, and the #b Market Momentum#! needle swings bear. The deliberate counter to a mania: no moral hazard."
 bb.60.c: "Hold. The market can find its own level."
 bb.60.c.tt: "The Bank does nothing today. No cost — but the session still counts against the 18-month cooldown."

 # ── bb.61: Market Survey ──────────────────────────────────────────────────────
 bb.61.t: "A Reading of the Market"
 # Paragraph 1 — momentum (chosen from the underlying trend)
 bb.61.desc.up_strong: "The analysts are unambiguous: capital is flowing in with real conviction. A #G strong upward trend#! runs beneath the market and will carry it higher for months yet — though a wise hand remembers that the steepest climbs arm the hardest falls."
 bb.61.desc.up_mild: "The mood is quietly optimistic. A #g gentle upward trend#! is at work beneath the surface, nudging the market higher month by month."
 bb.61.desc.down_strong: "The reading is grim. A #R strong downward trend#! has taken hold beneath the market and will drag it lower for some time — the doors are still open, but the water is rising."
 bb.61.desc.down_mild: "There is a chill in the air. A #r soft downward trend#! is working against the market, easing it lower month by month."
 bb.61.desc.flat: "The analysts find no clear current beneath the market just now — no lasting trend one way or the other. What moves prices this season is the news of the moment, not any deeper tide."
 # Paragraph 2 — current market band (read live off the health bar)
 bb.61.desc.band_booming: "\n\nThe market itself stands #G Booming#!. Enjoy it — and watch the #b Risk Stance#! bar, for confidence at these heights arms the multiplier that deepens every fall."
 bb.61.desc.band_growing: "\n\nThe market stands #g Growing#! — healthy, and drawing confidence upward on its own."
 bb.61.desc.band_stable: "\n\nThe market stands Stable — neither feverish nor failing."
 bb.61.desc.band_contracting: "\n\nThe market stands #r Contracting#!. Output is already suffering; a National Bank intervention becomes available should it slip below 40."
 bb.61.desc.band_crashing: "\n\nThe market stands #R Crashing#!. This is the emergency: intervention and, in the last resort, suspending the exchange are on the table."
 # Paragraph 3 — standing advice
 bb.61.desc.guidance: "\n\nRemember the levers at your disposal: #Y Open-Market Operations#! to lean the trend for or against the market, #Y Fiscal Temperature#! to set the investors' appetite for risk over the long term, and — in a true crisis — the #Y National Bank#! itself."
 bb.61.a: "A most useful briefing."

 # ── Newsfeed: Governor & Holiday ──────────────────────────────────────────────
 notification_bb_news_governor_appointed_name: "A New Hand at the National Bank"
 notification_bb_news_governor_appointed_desc: "A new Governor of the National Bank has been seated. Their acumen and temperament will steer the markets for as long as they hold the office — look for the governor trait on their character."
 notification_bb_news_governor_appointed_tooltip: "#header $notification_bb_news_governor_appointed_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_governor_appointed_desc$"

 notification_bb_news_lion_name: "Lion of the Bourse"
 notification_bb_news_lion_desc: "Two unbroken years of booming markets have made the Governor of the National Bank a legend of the exchanges. The governor permanently gains the #b Lion of the Bourse#! trait: markets drift upward on reputation alone while they remain in office."
 notification_bb_news_lion_tooltip: "#header $notification_bb_news_lion_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_lion_desc$"

 notification_bb_news_market_holiday_name: "The Exchange Is Dark"
 notification_bb_news_market_holiday_desc: "By government order the exchange doors are barred for four months. No market shocks can land while trading is suspended — but the underlying trend keeps running, and commerce pays the toll.\n\n#b Market Health:#! shielded from events until the holiday ends."
 notification_bb_news_market_holiday_tooltip: "#header $notification_bb_news_market_holiday_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_market_holiday_desc$"

 # ── bb.11: Outcome Notification Event ────────────────────────────────────────
 bb.11.t: "Antitrust Case Filed"
 bb.11.d.strong: "The government's case has been filed with unusual force. The chosen champion's zeal — combined with the weight of the law — has thrown the monopolists onto the defensive. Market concentration is being rolled back rapidly, though the affected interests are furious."
 bb.11.d.base: "The government's antitrust case has been submitted. The inquiry will proceed steadily, applying gradual pressure on the most entrenched monopolistic interests. Affected capitalists and aristocrats have mobilised their supporters in response."
 bb.11.d.weak: "The antitrust case has been filed — though observers note the inquiry's champion seems in no hurry. Proceedings advance at a glacial pace, favoured firms escape scrutiny, and the champion's own allies appear to be emerging stronger than before."
 bb.11.a: "We proceed."
