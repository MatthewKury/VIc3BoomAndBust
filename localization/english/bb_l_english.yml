l_english:

 # ── Journal Entry ─────────────────────────────────────────────────────────────
 je_bb_financial: "Boom & Bust: Financial Monitor"
 je_bb_financial_reason: "The nation's financial system requires attention."
 je_bb_financial_desc: "Three forces shape the financial landscape of your nation. The health of the market determines industrial output. The risk appetite of investors governs private capital formation. The concentration of monopoly power shifts wealth and political influence toward the elite.\n\n§YFinancial Market Health§!\n  §RCrashing§! (0–19)  •  §rContracting§! (20–39)  •  Stable (40–59)  •  §gGrowing§! (60–79)  •  §GBooming§! (80–100)\n\n§YFinancial Risk Stance§!\n  §RPessimistic§! (0–19)  •  §rCautious§! (20–39)  •  Tolerant (40–59)  •  §gOptimistic§! (60–79)  •  §GAudacious§! (80–100)\n\n§YMonopoly Power§!\n  Non-existent (0–19)  •  Trivial (20–39)  •  §yPresent§! (40–59)  •  §rInfluential§! (60–79)  •  §RDominant§! (80–100)"

 # ── Progress Bar Labels ───────────────────────────────────────────────────────
 bb_market_health_bar: "Financial Market Health"
 bb_market_health_bar_desc: ""

 bb_risk_stance_bar: "Financial Risk Stance"
 bb_risk_stance_bar_desc: ""

 bb_monopoly_power_bar: "Monopoly Power"
 bb_monopoly_power_bar_desc: ""

 # ── Market Health Modifiers ───────────────────────────────────────────────────
 bb_market_crashing: "Market Crash"
 bb_market_crashing_desc: "Financial markets have collapsed. Businesses cannot secure credit or capital, dragging all industrial output down severely."

 bb_market_contracting: "Contracting Markets"
 bb_market_contracting_desc: "Financial markets are shrinking. Reduced capital availability suppresses industrial output across the economy."

 bb_market_stable: "Sluggish Markets"
 bb_market_stable_desc: "Markets are technically stable but uninspiring. Cautious capital allocation produces a mild drag on industrial output."

 bb_market_booming: "Booming Markets"
 bb_market_booming_desc: "Financial markets are surging. Abundant credit and investor confidence provide a modest boost to industrial output."

 # ── Risk Stance Modifiers ─────────────────────────────────────────────────────
 bb_stance_pessimistic: "Investor Pessimism"
 bb_stance_pessimistic_desc: "Private investors have abandoned the market entirely. The state must drive economic growth, granting the government increased authority — but private investment has all but vanished and borrowing costs are punishing."

 bb_stance_cautious: "Investor Caution"
 bb_stance_cautious_desc: "Investors are pulling back sharply from private construction. The government steps in as the primary source of growth, gaining authority, while private capital formation and interest rate burdens remain elevated."

 bb_stance_tolerant: "Cautious Investment"
 bb_stance_tolerant_desc: "Investors are participating but reluctantly. Private investment is meaningfully below normal, and borrowing remains more expensive than the baseline."

 bb_stance_optimistic: "Cautious Optimism"
 bb_stance_optimistic_desc: "Investors are increasingly willing to deploy capital. Private investment is nearly back to normal levels."

 # ── Monopoly Power Modifiers ──────────────────────────────────────────────────
 bb_monopoly_present: "Emerging Monopolies"
 bb_monopoly_present_desc: "Large firms are beginning to dominate certain sectors. Consolidated production brings modest efficiency gains while industrialists and landowners grow more politically assertive."

 bb_monopoly_influential: "Influential Monopolies"
 bb_monopoly_influential_desc: "Monopolistic firms exert significant control over the economy. Market consolidation produces real output gains, but workers see their wages squeezed as competition diminishes and industrial and landed elites grow powerful."

 bb_monopoly_dominant: "Monopoly Dominance"
 bb_monopoly_dominant_desc: "A handful of firms control vast swaths of the economy. Output benefits from extreme consolidation, but industrialists and landowners wield outsized political power and workers' wages are heavily suppressed."

 # ── Monopoly Bar Monthly Progress Tooltips ───────────────────────────────────
 bb_monopoly_tick_laissez_faire: "Laissez-faire markets (unchecked)"
 bb_monopoly_tick_extraction: "Extraction economy"
 bb_monopoly_tick_traditionalism: "Traditionalist economy"
 bb_monopoly_tick_interventionism: "Interventionist regulation"
 bb_monopoly_tick_agrarianism: "Agrarian economy"
 bb_monopoly_tick_industry_banned: "Industry banned"
 bb_monopoly_tick_cooperative: "Cooperative ownership"
 bb_monopoly_tick_command: "Command economy (breaking up monopolies)"
 bb_monopoly_dissolution_active: "Monopoly dissolution case (active)"

 # ── Antitrust Law Group ───────────────────────────────────────────────────────
 lawgroup_bb_antitrust: "Antitrust Policy"
 lawgroup_bb_antitrust_desc: "How the government regulates the concentration of market power."

 law_bb_free_market: "Free Market"
 law_bb_free_market_desc: "The government does not interfere with market consolidation. Monopolies form and dissolve according to natural competitive pressures."

 law_bb_letters_of_patent: "Letters of Patent"
 law_bb_letters_of_patent_desc: "The government issues exclusive charters granting monopoly rights to favoured firms. In exchange, patent-holders supply military goods at preferential rates (−10%) and subsidise construction inputs (−5%). Accelerates market concentration, and is incompatible with laissez-faire or collectivist economic systems."

 law_bb_oversight_committees: "Oversight Committees"
 law_bb_oversight_committees_desc: "Standing committees of experts monitor market concentration and can intervene before dominance becomes entrenched. Maintaining these bodies consumes significant bureaucratic capacity."

 law_bb_anticompetitive_legislation: "Anticompetitive Legislation"
 law_bb_anticompetitive_legislation_desc: "Formal statutes prohibit collusion, predatory pricing, and other practices that entrench monopoly power. The government's ability to break up existing monopolies is significantly enhanced."

 # ── Adjust Fiscal Temperature Button (on je_bb_financial) ────────────────────
 bb_fiscal_temperature_button: "Adjust Fiscal Temperature"
 bb_fiscal_temperature_button_desc: "Direct the treasury and central lenders to heat or cool the nation's investment climate. The chosen stance will steer investor risk appetite for the next five years and cannot be reversed until it has run its course."
 bb_fiscal_temp_active: "Fiscal temperature policy"

 # ── Risk Stance Character Influence Tooltips ─────────────────────────────────
 # NOTE: these are embedded in the PROGRESS_BAR_BREAKDOWN data function.
 # Apostrophes break its string parsing — do not use them here.
 bb_risk_ruler_heats: "Speculative temperament of the ruler"
 bb_risk_ruler_cools: "Prudent temperament of the ruler"
 bb_risk_gov_leaders: "Temperament of government leaders"
 bb_risk_public_figures: "Agitators and magnates swaying public sentiment"

 # ── bb.20: Fiscal Temperature Selection Event ────────────────────────────────
 bb.20.t: "Adjust the Fiscal Temperature"
 bb.20.desc: "The treasury awaits instruction. By loosening or tightening the flow of credit, the government can embolden investors to take greater risks — or restrain their exuberance before it curdles into folly. Whichever course is set will bind fiscal policy for the next five years."
 bb.20.a: "Flood the market with cheap credit."
 bb.20.a.tt: "Investor #b Risk Stance#! will rise #b rapidly#! for the next 5 years."
 bb.20.b: "Encourage lending on generous terms."
 bb.20.b.tt: "Investor #b Risk Stance#! will rise #b gradually#! for the next 5 years."
 bb.20.c: "Tighten lending standards."
 bb.20.c.tt: "Investor #b Risk Stance#! will fall #b gradually#! for the next 5 years."
 bb.20.d: "Impose strict credit discipline."
 bb.20.d.tt: "Investor #b Risk Stance#! will fall #b rapidly#! for the next 5 years."

 # ── bb.21: Fiscal Temperature Expiry Notification ────────────────────────────
 bb.21.t: "Fiscal Policy Runs Its Course"
 bb.21.desc: "Five years have passed since the government last set the fiscal temperature. The measures have expired, investor sentiment is once again drifting on its own currents, and the treasury stands ready to receive new instruction."
 bb.21.a: "Noted."

 # ── Dissolve Monopoly Button (on je_bb_financial) ─────────────────────────────
 bb_dissolve_monopoly_button: "Dissolve Monopoly"
 bb_dissolve_monopoly_button_desc: "Launch a formal government case against the nation's entrenched monopolies. A champion must be chosen from the governing coalition to lead the inquiry. The political cost is steep, and the industrialists and landed elite will not accept this quietly."

 # ── Antitrust Case Cost Modifier ─────────────────────────────────────────────
 bb_antitrust_case_cost: "Antitrust Proceedings"
 bb_antitrust_case_cost_desc: "The government is pressing an active case against monopolistic firms. Sustaining political pressure on powerful interests drains authority."

 # ── Dissolution Marker & Champion Modifiers ──────────────────────────────────
 bb_monopoly_dissolution: "Monopoly Dissolution (Active)"
 bb_monopoly_dissolution_desc: "A formal case is dismantling entrenched monopolies. Its monthly effect on market concentration depends on who leads the inquiry — their interest group, character, and ideology — and on the strength of the nation's antitrust statutes."

 bb_case_conflicted_champion: "Steering the Inquiry"
 bb_case_conflicted_champion_desc: "This interest group's leader heads the antitrust inquiry — and is quietly steering it to entrench their own group's political position while sparing favoured firms."

 # ── bb.10: Character Selection Event ─────────────────────────────────────────
 bb.10.t: "Launch an Antitrust Case"
 bb.10.desc: "The monopolies have grown powerful enough to warrant a formal government response. Select a member of the governing coalition to champion the case — their character will determine how effectively the inquiry proceeds and how fiercely the affected interests will resist."
 bb.10.a: "Commission the Intelligentsia to lead the inquiry."
 bb.10.b: "Commission the Trade Unions to lead the inquiry."
 bb.10.c: "Commission the Petty Bourgeoisie to lead the inquiry."
 bb.10.d: "Commission the Industrialists to lead the inquiry."
 bb.10.e: "Commission the Landowners to lead the inquiry."
 bb.10.f: "Commission the Devout to lead the inquiry."
 bb.10.g: "Commission the Armed Forces to lead the inquiry."
 bb.10.h: "Commission the Rural Folk to lead the inquiry."
 bb.10.z: "Let the civil service handle it without a political champion."

 # ── Market Health Bar Monthly Progress Tooltips ──────────────────────────────
 # NOTE: embedded in PROGRESS_BAR_BREAKDOWN — no apostrophes allowed here.
 bb_health_market_events: "Market news of the month"
 bb_health_trend: "Underlying market trend"
 bb_health_floor_pessimistic: "Pessimistic investors hold almost no exposure (floor)"
 bb_health_floor_cautious: "Cautious investors limit their exposure (floor)"

 # ── Newsfeed: Minor Market Events ─────────────────────────────────────────────
 notification_bb_news_earnings_name: "Strong Earnings Season"
 notification_bb_news_earnings_desc: "The great firms report handsome profits, and the exchanges respond warmly."
 notification_bb_news_earnings_tooltip: "#header $notification_bb_news_earnings_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_earnings_desc$\n\nFinancial #b Market Health#! rises this month. The gain is larger the bolder the nation's #b Risk Stance#!."

 notification_bb_news_flotation_name: "Triumphant Share Flotation"
 notification_bb_news_flotation_desc: "A new joint-stock venture is oversubscribed within hours of opening its books."
 notification_bb_news_flotation_tooltip: "#header $notification_bb_news_flotation_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_flotation_desc$\n\nFinancial #b Market Health#! rises sharply this month. The gain is larger the bolder the nation's #b Risk Stance#!."

 notification_bb_news_foreign_capital_name: "Foreign Capital Trickles In"
 notification_bb_news_foreign_capital_desc: "Overseas financiers are quietly taking positions in our markets. Observers expect the inflow to continue for some months."
 notification_bb_news_foreign_capital_tooltip: "#header $notification_bb_news_foreign_capital_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_foreign_capital_desc$\n\nFinancial #b Market Health#! rises, and an #b upward trend#! will lift the market for several months."

 notification_bb_news_credit_expansion_name: "Credit Flows Freely"
 notification_bb_news_credit_expansion_desc: "Lenders are extending credit on remarkably generous terms. The exchanges cheer — though sober voices warn that today's easy money will be tomorrow's reckoning."
 notification_bb_news_credit_expansion_tooltip: "#header $notification_bb_news_credit_expansion_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_credit_expansion_desc$\n\nFinancial #b Market Health#! rises sharply now, but a #b downward trend#! will weigh on the market for months to come."

 notification_bb_news_confidence_name: "Confidence Builds"
 notification_bb_news_confidence_desc: "Little has changed on the exchanges themselves, but merchants and financiers alike speak of brighter months ahead."
 notification_bb_news_confidence_tooltip: "#header $notification_bb_news_confidence_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_confidence_desc$\n\nA modest gain now, and an #b upward trend#! will lift Financial #b Market Health#! for several months."

 notification_bb_news_bank_failure_name: "Provincial Bank Fails"
 notification_bb_news_bank_failure_desc: "A regional lender has shuttered its doors, and depositors crowd the street outside demanding their savings."
 notification_bb_news_bank_failure_tooltip: "#header $notification_bb_news_bank_failure_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_bank_failure_desc$\n\nFinancial #b Market Health#! falls sharply this month. The loss is far larger the bolder the nation's #b Risk Stance#!."

 notification_bb_news_commodity_glut_name: "Commodity Glut"
 notification_bb_news_commodity_glut_desc: "Warehouses overflow and prices sag as key goods find no buyers."
 notification_bb_news_commodity_glut_tooltip: "#header $notification_bb_news_commodity_glut_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_commodity_glut_desc$\n\nFinancial #b Market Health#! falls this month. The loss is far larger the bolder the nation's #b Risk Stance#!."

 notification_bb_news_fraud_scandal_name: "Fraud at a Great House"
 notification_bb_news_fraud_scandal_desc: "A celebrated financier stands exposed as a swindler. Confidence in the exchanges is shaken, and the whispers will not soon die down."
 notification_bb_news_fraud_scandal_tooltip: "#header $notification_bb_news_fraud_scandal_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_fraud_scandal_desc$\n\nFinancial #b Market Health#! falls now, and a #b downward trend#! will weigh on the market for months."

 notification_bb_news_foreign_wobble_name: "Tremors in Foreign Markets"
 notification_bb_news_foreign_wobble_desc: "Unsettling news from exchanges abroad has made our own investors briefly hesitant."
 notification_bb_news_foreign_wobble_tooltip: "#header $notification_bb_news_foreign_wobble_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_foreign_wobble_desc$\n\nFinancial #b Market Health#! dips this month. The loss is larger the bolder the nation's #b Risk Stance#!."

 notification_bb_news_credit_tightening_name: "Lenders Tighten Their Books"
 notification_bb_news_credit_tightening_desc: "Credit has grown dear and speculative ventures are being called in. Painful — but the survivors will stand on firmer ground."
 notification_bb_news_credit_tightening_tooltip: "#header $notification_bb_news_credit_tightening_name$#!\n$TOOLTIP_DELIMITER$\n$notification_bb_news_credit_tightening_desc$\n\nFinancial #b Market Health#! falls now, but an #b upward trend#! will support the market for months to come."

 # ── Bailout Burden Modifier ───────────────────────────────────────────────────
 bb_bailout_burden: "Bailout Burden"
 bb_bailout_burden_desc: "The treasury borrowed heavily to guarantee bank deposits during the panic. Servicing that debt keeps the state's borrowing costs elevated."

 # ── bb.30: Mania on the Exchange ──────────────────────────────────────────────
 bb.30.t: "Mania on the Exchange"
 bb.30.desc: "A speculative fever has gripped the exchanges. Clerks mortgage their salaries to buy shares, respectable matrons trade tips at the opera, and every week a new venture is floated to feverish applause. The nation's financiers insist this time is different. The government must decide whether to let the mania run its course — or take away the punch bowl."
 bb.30.a: "Let the good times roll."
 bb.30.a.tt: "Financial #b Market Health#! surges #b now#!, but a #b strong downward trend#! will drag the market for the next #b 12 months#! as the mania unwinds."
 bb.30.b: "Deflate the bubble before it bursts on its own."
 bb.30.b.tt: "Financial #b Market Health#! drops #b now#!, but a #b steady upward trend#! will support the market for #b 12 months#!. Capitalists are furious at the lost paper fortunes."
 bb.30.c: "Channel the fever into productive industry."
 bb.30.c.tt: "The Industrialists steer speculation toward real factories. #b Market Health#! rises now with only a #b mild downward trend#! to follow, and capitalists are pleased."
 bb.30.d: "Rein in these speculating parvenus."
 bb.30.d.tt: "The Landowners impose old-fashioned restraint. #b Market Health#! dips now but gains a #b mild upward trend#!. The aristocracy approves; the capitalists do not."

 # ── bb.31: Panic! ─────────────────────────────────────────────────────────────
 bb.31.t: "Panic!"
 bb.31.desc: "It began with a rumour, as it always does. By noon the street outside the banks was impassable, and by nightfall respectable institutions were paying out savings in worthless scrip. The panic now feeds upon itself. The government must choose who is to be saved — and who is to be sacrificed."
 bb.31.a: "The treasury will guarantee every deposit."
 bb.31.a.tt: "Financial #b Market Health#! steadies #b now#! and gains a #b strong upward trend#! for #b 12 months#! — but the treasury must borrow heavily, raising the nation's #b loan interest#! for #b 24 months#!."
 bb.31.b: "Let the weak banks fail."
 bb.31.b.tt: "Financial #b Market Health#! plunges #b now#!, but the purge clears the rot: a #b very strong upward trend#! follows for #b 12 months#!. The ruined middle classes will not forgive quickly."
 bb.31.c: "Shield the small depositor. Punish the financier."
 bb.31.c.tt: "The Trade Unions demand justice. #b Market Health#! slips a little now but gains a #b solid upward trend#!. Workers are grateful; capitalists seethe."
 bb.31.d: "Return to hard money and sound banking."
 bb.31.d.tt: "The Landowners restore gold-backed discipline. #b Market Health#! dips now, but a #b long, steady upward trend#! follows for #b 18 months#!. The aristocracy approves."

 # ── bb.32: Foreign Capital Comes Calling ──────────────────────────────────────
 bb.32.t: "Foreign Capital Comes Calling"
 bb.32.desc: "A consortium of foreign financiers has arrived in the capital with letters of introduction and very deep pockets. They propose to underwrite our markets on a grand scale. Their money is real enough — but money from abroad always arrives with strings attached, and the shopkeepers already mutter about foreign masters."
 bb.32.a: "Welcome them with open arms."
 bb.32.a.tt: "Financial #b Market Health#! rises #b now#! and gains an #b upward trend#! for #b 10 months#!. The middle classes resent the foreign presence."
 bb.32.b: "Politely decline."
 bb.32.b.tt: "No change to the markets. The middle classes appreciate the government standing up for domestic interests."
 bb.32.c: "Accept — under strict domestic-ownership requirements."
 bb.32.c.tt: "The Petty Bourgeoisie writes the terms. #b Market Health#! dips slightly now but gains a #b modest upward trend#! for #b 12 months#!, and the shopkeepers are pleased."
 bb.32.d: "Demand their expertise alongside their capital."
 bb.32.d.tt: "The Intelligentsia negotiates for knowledge as well as money. #b Market Health#! rises now and gains a #b strong upward trend#! for #b 10 months#!."

 # ── bb.11: Outcome Notification Event ────────────────────────────────────────
 bb.11.t: "Antitrust Case Filed"
 bb.11.d.strong: "The government's case has been filed with unusual force. The chosen champion's zeal — combined with the weight of the law — has thrown the monopolists onto the defensive. Market concentration is being rolled back rapidly, though the affected interests are furious."
 bb.11.d.base: "The government's antitrust case has been submitted. The inquiry will proceed steadily, applying gradual pressure on the most entrenched monopolistic interests. Affected capitalists and aristocrats have mobilised their supporters in response."
 bb.11.d.weak: "The antitrust case has been filed — though observers note the inquiry's champion seems in no hurry. Proceedings advance at a glacial pace, favoured firms escape scrutiny, and the champion's own allies appear to be emerging stronger than before."
 bb.11.a: "We proceed."
